site_name: BrainLabLLM
site_description: A local-first AI chat and meeting-notes assistant for the lab.
site_url: https://musallgroup.github.io/BrainLabLLM/
repo_url: https://github.com/musallGroup/BrainLabLLM
repo_name: musallGroup/BrainLabLLM
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - First-Time Setup: getting-started/first-run.md
  - User Guide:
      - Chat: user-guide/chat.md
      - Meetings: user-guide/meetings.md
      - Agent: user-guide/agent.md
      - Settings: user-guide/settings.md
  - Configuration: configuration.md
  - Troubleshooting: troubleshooting.md
  - Architecture: architecture.md
  - Development:
      - Building from Source: development/building.md
      - Packaging & Distribution: development/packaging.md
      - Contributing: development/contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-render.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/musallGroup/BrainLabLLM

copyright: Built for internal lab use.
